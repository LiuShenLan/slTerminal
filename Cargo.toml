[workspace]
members = [
    "slterm_app",
    "slterm_terminal",
    "slterm_completions",
    "slterm_hook",
    "slterm_settings",
    "slterm_split",
    "slterm_runtime_protocol",
    "slterm_path",
    "slterm_document",
    "slterm_workspace",
    "slterm_sidebar",
    "slterm_agents",
    "slterm_hooks",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
# GPL-3.0 四落点之二:成员 crate 经 `license.workspace = true` 继承。
license = "GPL-3.0"

[profile.release]
# Thin LTO preserves package-specific optimization levels. Dependencies retain
# one codegen unit; the application uses parallel codegen with the same O3 level.
lto = "thin"
# 面板错误边界依赖 catch_unwind;release 必须保持 unwind,不得改为 abort。
panic = "unwind"
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1
# 发布包体积预算:2026-10-18 全量功能态 release 实测(本 profile 状态)
# setup.exe 17.07 MiB / 便携 zip 22.21 MiB;以「实测值 + 15% 裕度」钉在
# scripts/tests/package-release.tests.ps1(实测值、校准日期、裕度在该测试注释
# 内登记)。冷代码(协议栈、序列化、CLI 等)按体积编译;渲染/塑形/布局/VT
# 热路径在下方 [profile.release.package] 逐个钉回 O3。超预算即红;收紧预算
# 永远合法,放宽须在提交信息说明原因。改动 profile 体积相关数值必须重跑
# 体积钉测试。
opt-level = "s"

# 热路径钉包清单:渲染(resvg/image)+ 塑形(rustybuzz/ttf-parser)+ 布局(taffy)
# + VT 与终端核心(slterm_terminal)+ 壳(slterm/gpui/gpui-component/smol)。
# 主 crate 以 16 个 codegen unit 并行编译(同 O3),其余依赖维持单 unit 的
# thin LTO 体积收益。清单随架构演进重登记并重跑钉测试。
[profile.release.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui-component = { opt-level = 3 }
slterm_terminal = { opt-level = 3 }
slterm = { opt-level = 3, codegen-units = 16 }
image = { opt-level = 3 }

# Debug 壳仍要承担真实终端负载:GPUI 布局/字体塑形和 VT 解析若以
# opt-level 0 运行,窗口拖拽与持续输入都会出现发布版没有的延迟。
# 外部依赖统一 O2(图形栈/图像解码/Unicode 处理散布在
# 几十个 crate 里,逐个点名永远漏),少数塑形/布局热点保持 O3;
# workspace 成员不受 "*" 影响,主 crate 继续增量 debug。
# 热路径钉包清单(resvg/rustybuzz/taffy/gpui 等)随 M 阶段依赖迁入逐个回填。
[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
"*" = { opt-level = 2 }

[workspace.dependencies]
# ---- GPUI v1.16.1 固定基线 ------------------------------------------------
#
# 版本配对:Zed v1.16.1 提交上的 gpui 0.2.2 / gpui_platform 0.1.0,配套
# gpui-component 0.5.2 和 gpui-component-assets 0.5.1。版本号与 Git rev 都
# 精确固定,禁止 main、通配版本或仅凭 branch 名解析。
#
# 上游基线:zed-industries/zed v1.16.1
#   @ eb8e1c8b5502b7007465fbbc465f4a736fa39210
# 固定 fork 只做补丁减法:保留 Windows、输入、测试与生命周期修复,删除 X11、
# 旧 GFM、数学桥和未使用的阴影 helper。完整审计链由固定 fork 的提交历史锚定。
#
# 所有 Zed 依赖统一使用 LiuShenLan/zed URL:Cargo 的 source identity 包含 URL,
# 应用与组件内部若混用不同 URL,即使 SHA 相同也会解析成两套 gpui 类型。
# 新增 Zed/component 补丁必须从固定基线开独立分支、逐条提交并更新
# exact rev,不能移动基线 branch/tag。
gpui = { git = "https://github.com/LiuShenLan/zed", rev = "398ddb60f3d188af95e3661b1b1de8be0cbebbd7", version = "=0.2.2" }
# GPUI v1.16.1 把平台启动入口拆到独立 crate。它必须与 `gpui` 使用完全相同
# 的 Git URL 和 rev,否则 Cargo 会把同名类型解析成两套互不兼容的 crate。
gpui_platform = { git = "https://github.com/LiuShenLan/zed", rev = "398ddb60f3d188af95e3661b1b1de8be0cbebbd7", version = "=0.1.0", features = ["font-kit"] }
gpui-component = { git = "https://github.com/LiuShenLan/gpui-kit", rev = "d71650dd3f99d89cffa243147ed4c2f103974401", version = "=0.5.2" }
gpui-component-assets = { git = "https://github.com/LiuShenLan/gpui-kit", rev = "d71650dd3f99d89cffa243147ed4c2f103974401", version = "=0.5.1" }

[patch.crates-io]
# 上游 0.8.3 未强制 MSVC 环境；仓内补丁仅增加 Meson --vsenv。
dav1d-sys = { path = "vendor/dav1d-sys" }
