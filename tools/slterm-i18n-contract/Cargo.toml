[package]
name = "slterm-i18n-contract"
version = "0.0.0"
edition = "2024"
publish = false

# 独立 workspace:合同测试脱离应用壳与 GPUI 依赖独立跑
# (`cargo test` 于本目录)。
[workspace]

# lib target 复用应用侧合同测试文件,经 #[path] 复编生成器与查询核心。
[lib]
path = "../../slterm_app/tests/i18n_contract.rs"

[dependencies]
slterm-settings = { path = "../../slterm_settings" }
serde = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

[build-dependencies]
slterm-settings = { path = "../../slterm_settings" }
serde = "1"
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
