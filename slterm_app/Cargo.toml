[package]
name = "slterm"
# 首发版本线续 0.3.0:更新链对 <0.3.0 一律视为需手动重装。
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 显式 test target——定向测试一律
# `cargo test -p slterm --test lib_tests <filter>`,禁 filter 直打默认 lib target
# (filter/--lib 会绕过 test=false 重建默认单测 target,manifest 控制随之失效)。
[lib]
name = "slterm"
path = "src/lib.rs"
test = false

[[bin]]
name = "slterm"
path = "src/main.rs"

[[test]]
name = "lib_tests"
path = "src/lib.rs"

# console 子系统对照目标(开放问题 2 已裁「保留重设」):
# 与本体同 console 子系统形态,Ctrl+C 继承语义的独立回归锚。
# 运行纪律(spawn 子进程发真 Ctrl+C,串行):
# `cargo test -p slterm --test windows_console_startup -- --test-threads=1`。
[[test]]
name = "windows_console_startup"
path = "tests/windows_console_startup.rs"

[features]
# 一条 feature 同时打开 gpui 与 gpui-component 的测试支持;
# UI 测试全部 `#[cfg(all(test, feature = "gpui-test-support"))]` 双门控,
# feature 未开时虚拟窗口用例整体不编译,生产构建不带测试夹具。
gpui-test-support = ["gpui/test-support", "gpui-component/test-support"]
# 本地假 release 服务器演练通道:只用于 debug
# 验收/发布彩排;`update_check::test_source` 在 release 构建下编译期拒绝。
update-test-source = []

[dependencies]
# GPUI 钉版与 URL/rev 一致性纪律见根 Cargo.toml 固定基线注释块。
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
slterm_terminal = { path = "../slterm_terminal" }
# 包名带连字符(lib 目标名 cargo 自动转下划线,代码里 `use slterm_settings`)。
slterm-settings = { path = "../slterm_settings" }
# 泛型 SplitTree 分屏树与几何纯函数(零生产依赖 core)。
slterm-split = { path = "../slterm_split" }
slterm_workspace = { path = "../slterm_workspace" }
slterm_sidebar = { path = "../slterm_sidebar" }
slterm_runtime_protocol = { path = "../slterm_runtime_protocol" }
slterm_path = { path = "../slterm_path" }
slterm_agents = { path = "../slterm_agents" }
# SQLite 仅由 application 持久化适配持有；bundled 固定内嵌实现，backup 用于灾难副本。
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
# 补全匹配/语义引擎(core crate):独立轻量库,应用层只消费候选。
slterm_completions = { path = "../slterm_completions" }
# workspace 选择器 glob 语义(只读 package.json/yaml 声明,不执行项目代码)。
glob = "0.3.4"
# vte 类型面(Color/CursorShape/NamedColor/Rgb + 测试注入 Processor):
# core 刻意不再导出(「解析器不经本 crate 再导出」),壳侧同名钉版,
# 版本/feature 必须与 slterm_terminal/Cargo.toml 逐字一致,跨 crate 类型才同一。
vte = { version = "0.15.0", default-features = false, features = ["std", "ansi"] }
# AppError::Gpui 的载体:gpui 的 anyhow 再导出藏在 doc(hidden) private 模块
# (宏内部专用),业务侧必须直连 anyhow 本体。
anyhow = "1"
log = "0.4"
# 安全审计通道:唯一形态 = tracing target
# "audit";`log-always` 让事件无条件桥接进既有 log 栈(单日志栈,不重复
# 初始化)——审计取证不因任何 tracing subscriber 装配而丢事件。
# 若未来装配全局 subscriber,必须同时移除 `log-always` 或让 subscriber
# 过滤 audit target,否则同一事件双落点(日志 + subscriber)。
tracing = { version = "0.1", features = ["log-always"] }
# ai_hook 信封/载荷解析(helper 不重编码,JSON 工作全在宿主侧)。
# RawValue 保留 session 内 core DTO 的原始 JSON，供独立容错恢复检查重复字段。
serde_json = { version = "1", features = ["raw_value"] }
# CLI 双人格 clap 面:同 exe 子命令与 GUI 参数共用一份定义,
# --help/版本/参数拒绝由 clap 统一产出。精确 pin 到当前构建/测试基线
# (Cargo.lock 实解析 4.6.7),避免 caret 漂移改变 --help/解析语义。
clap = { version = "=4.6.7", features = ["derive"] }
# 屏幕规则 TOML 反序列化(规则资源随仓,声明式规则改不动代码)。
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# 屏幕规则正则:逐规则编译一次进缓存,detect 热路径只跑匹配。
# 文档图片 URL 重写(预览)同样复用该正则栈。
regex = "1"
# Markdown mdast 解析(编辑器内核:Outline/Projection/块结构单源)。
# 版本与上游固定基线逐字一致,AST 语义(含 math_flow)才可照抄。
markdown = "=1.0.0"
# Markdown 实体解码(Projection 可见文本 ↔ 源码 span 双向映射;数学引擎的
# 传输层实体解码共用同一实现)。
html-escape = "0.2.14"
# AI 助手修复请求:后台线程一次短 JSON POST。选 ureq 而非 reqwest:
# 不与 tokio 耦合,依赖树小。
# socks-proxy:更新器把注册表 `socks=` 解析成 socks5:// 后需要真实握手。
ureq = { version = "3", features = ["json", "socks-proxy"] }
# 数学引擎:TeX 事件流解析。版本与上游重构基线逐字一致
# (pulldown-latex =0.7.1),事件语义/兼容重写才可照抄。
pulldown-latex = "=0.7.1"
# OpenType MATH 表访问(轴高/分式/根号/伸缩字形)。固定 0.25.1,
# default-features 关闭后只开 MATH 所需的 opentype-layout + std。
ttf-parser = { version = "=0.25.1", default-features = false, features = ["opentype-layout", "std"] }
# 字形轮廓 CPU 栅格化。固定 0.1.10,保证覆盖度曲线与像素结果可回归。
ab_glyph_rasterizer = "=0.1.10"
# 数学字体缺字时的文本兜底列宽(半 em/全 em)。
unicode-width = "0.2.0"
# 公式布局 LRU 的哈希器(no-rng:确定性构造,不引入随机源)。
ahash = { version = "0.8.6", features = ["no-rng"] }
# keymap/sequence.rs 的修饰键位族(与 core 同版本族)。
bitflags = "2.4.1"
# 凭据出域句柄即用即焚(先落消费接口 trait)。
zeroize = "1"
# 加密备份:AES-256-GCM 密封 + Argon2id 口令派生。版本与
# 上游固定基线逐字一致(派生参数组作契约数值随迁)。
aes-gcm = "0.11"
argon2 = "0.6.0-rc.8"
# 盐与 nonce 的系统随机源(0.3 的 `fill` 形态,与上游同族)。
getrandom = "0.3"
# 事件信箱/session_pump 的异步通道与 Stream(event_mailbox.rs 随迁形态)。
futures = "0.3"
# first_frame 取原生 HWND 走 raw-window-handle(与 gpui 内部同版本族),
# 不经 winit 中转——winit 事件循环本体不迁。
raw-window-handle = "0.6"
# ai_hook 安装权威:codex/kimi 的 TOML 手术保注释保格式;managed 文件
# 归属指纹;cursor/copilot/grok 的 EncodedCommand 形态;codex 能力探针输出
# 暂存与测试 tempdir 隔离;config_guard 的配置目录监听(notify 钉 7 与
# gpui-component 同版本族,防双份构建)。
toml_edit = "0.25"
sha2 = "0.11"
base64 = "0.22"
tempfile = "3"
notify = "7"
# 壁纸与文档图片的本地解码。
image = { version = "=0.25.10", default-features = false, features = ["avif-native", "bmp", "gif", "ico", "jpeg", "png", "webp"] }
# Windows 系统代理读取:HKCU Internet Settings 的
# ProxyEnable/ProxyServer/ProxyOverride;不走 ureq 的 win-system-proxy。
winreg = "0.56"

[dev-dependencies]
# 审计事件格式断言:测试内作用域订阅器只开 fmt 层,
# 不引入全局 subscriber(生产仍走 tracing→log 单栈桥接)。
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
# 并发恢复测试经 SQLite trace 建立确定交错；生产依赖不启用该特性。
rusqlite = { version = "=0.41.0", features = ["trace"] }

[build-dependencies]
# i18n 静态生成器:目录遍历由语言注册表驱动,故构建期依赖设置 crate。
slterm-settings = { path = "../slterm_settings" }
# 翻译目录 JSON 解析(嵌套键展平 + 类型拒绝)。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# WinRT toast:XmlDocument/ToastNotification/ToastNotificationManager
# 与 MTA COM 初始化。版本与上游固定基线逐字一致(=0.61.3),features 只开投递
# 所需面;Win32 注册表/闪烁仍走 windows-sys(见下)。
windows = { version = "=0.61.3", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    # 开机启动 .lnk:IShellLinkW/IPersistFile 的 COM 写读;
    # GetPath 的 WIN32_FIND_DATAW 参数需要 Storage 面。
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    # 凭据管理器原语:CredReadW/CredWriteW/CredDeleteW/
    # CredFree 与 CREDENTIALW。
    "Win32_Security_Credentials",
] }
windows-sys = { version = "0.59", features = [
    # AUMID 注册(RegSetKeyValueW)。
    "Win32_System_Registry",
    # 任务栏进度(ITaskbarList3 的 CoInitializeEx/CoCreateInstance)。
    "Win32_System_Com",
    "Win32_Foundation",
    # MonitorFromPoint(开窗前 DPI 预取)。
    "Win32_Graphics_Gdi",
    # 系统 locale 探测(GetUserDefaultLocaleName):界面语言 System 档协商。
    "Win32_Globalization",
    # console 归一化(SetConsoleCtrlHandler)与 panic 报告的 GetConsoleCP。
    "Win32_System_Console",
    # 提权态探针(OpenProcessToken 的 TOKEN_QUERY + TokenElevation)。
    "Win32_Security",
    # atomic_file 原子替换前复制目标 owner/group/DACL
    # (GetNamedSecurityInfoW/SetNamedSecurityInfoW;LocalFree 在 0.59 归
    # Win32_Foundation,本清单已启用)。
    "Win32_Security_Authorization",
    # 命名管道服务器(ai_hook::windows;PIPE_ACCESS_INBOUND 在 FileSystem,
    # ConnectNamedPipe/ReadFile 的 OVERLAPPED 引用经 Win32_System_IO)。
    "Win32_System_Pipes",
    # 补全探测的可取消进程树回收(Job Object)。
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # 全机进程快照(process_snapshot::windows::NtQuerySystemInformation)。
    "Wdk_System_SystemInformation",
    # 窗口材质 gate:RtlGetVersion 判真实 build;
    # OSVERSIONINFOW 是同一查询的输出结构。
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    # 窗口材质:DwmSetWindowAttribute/DwmEnableBlurBehindWindow。
    "Win32_Graphics_Dwm",
    # 快照原生回归对拍:GetProcessTimes(process_snapshot 测试)。
    "Win32_System_Threading",
    # 托盘线程隐藏窗口的模块句柄(GetModuleHandleW)。
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    # GetAsyncKeyState(VK_LBUTTON):resize 手势门控(view/layout.rs)。
    "Win32_UI_Input_KeyboardAndMouse",
    # MessageBoxW(启动错误弹面/panic 钩)、SendMessageW(首帧 present-then-show)。
    "Win32_UI_WindowsAndMessaging",
    # SHFileOperationW(回收站删除)与 ShellExecuteW(系统处理器打开)。
    "Win32_UI_Shell",
] }
