[package]
name = "slterm"
edition.workspace = true
rust-version.workspace = true

# D11-1:显式 test target——定向测试一律
# `cargo test -p slterm --test lib_tests <filter>`,禁 filter 直打默认 lib target
# (filter/--lib 会绕过 test=false 重建默认单测 target,manifest 控制随之失效)。
[lib]
name = "slterm"
path = "src/lib.rs"
test = false

[[bin]]
name = "slterm"
path = "src/main.rs"

[[test]]
name = "lib_tests"
path = "src/lib.rs"

# console 子系统对照目标(11 篇;13 篇开放问题 2 已裁「保留重设」):
# 与本体同 console 子系统形态,Ctrl+C 继承语义的独立回归锚。
# 运行纪律(spawn 子进程发真 Ctrl+C,串行):
# `cargo test -p slterm --test windows_console_startup -- --test-threads=1`。
[[test]]
name = "windows_console_startup"
path = "tests/windows_console_startup.rs"

# Runtime API 行为级端到端(00-roadmap M7 出口;04 篇 M7.5):
# 真实桌面 + 预构建 exe 才执行,`SLTERM_E2E_EXE` 未设置时打印 SKIP 计通过
# (条件跳过登记于 .claude/test-exemptions.md)。
[[test]]
name = "runtime_conformance"
path = "tests/runtime_conformance.rs"

[features]
# 一条 feature 同时打开 gpui 与 gpui-component 的测试支持(11 篇锚定);
# UI 测试全部 `#[cfg(all(test, feature = "gpui-test-support"))]` 双门控,
# feature 未开时虚拟窗口用例整体不编译,生产构建不带测试夹具。
gpui-test-support = ["gpui/test-support", "gpui-component/test-support"]

[dependencies]
# GPUI 钉版与 URL/rev 一致性纪律见根 Cargo.toml 固定基线注释块。
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
slterm_terminal = { path = "../slterm_terminal" }
# 包名带连字符(lib 目标名 cargo 自动转下划线,代码里 `use slterm_settings`)。
slterm-settings = { path = "../slterm_settings" }
# PaneId/TabId + SplitTree 分屏树(纯数据 core,M3 workspace 雏形挂接)。
slterm-split = { path = "../slterm_split" }
# vte 类型面(Color/CursorShape/NamedColor/Rgb + 测试注入 Processor):
# core 刻意不再导出(「解析器不经本 crate 再导出」),壳侧同名钉版,
# 版本/feature 必须与 slterm_terminal/Cargo.toml 逐字一致,跨 crate 类型才同一。
vte = { version = "0.15.0", default-features = false, features = ["std", "ansi"] }
# AppError::Gpui 的载体:gpui 的 anyhow 再导出藏在 doc(hidden) private 模块
# (宏内部专用),业务侧必须直连 anyhow 本体。
anyhow = "1"
log = "0.4"
# ai_hook 信封/载荷解析(helper 不重编码,JSON 工作全在宿主侧)。
serde_json = "1"
# CLI 双人格 clap 面(04 篇 M7.4):同 exe 子命令与 GUI 参数共用一份定义,
# --help/版本/参数拒绝由 clap 统一产出(版本照 D04 基线 4.2.7)。
clap = { version = "4.2.7", features = ["derive"] }
# 屏幕规则 TOML 反序列化(规则资源随仓,声明式规则改不动代码)。
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# 屏幕规则正则:逐规则编译一次进缓存,detect 热路径只跑匹配。
# 文档图片 URL 重写(07 篇 M8.3 预览)同样复用该正则栈。
regex = "1"
# Markdown mdast 解析(07 篇 M8.2 编辑器内核:Outline/Projection/块结构单源)。
# 版本与上游固定基线逐字一致,AST 语义(含 math_flow)才可照抄。
markdown = "=1.0.0"
# Markdown 实体解码(Projection 可见文本 ↔ 源码 span 双向映射)。
html-escape = "0.2.14"
# keymap/sequence.rs 的修饰键位族(与 core 同版本族)。
bitflags = "2.4.1"
# 事件信箱/session_pump 的异步通道与 Stream(event_mailbox.rs 随迁形态)。
futures = "0.3"
# first_frame 取原生 HWND 走 raw-window-handle(与 gpui 内部同版本族),
# 不经 winit 中转——winit 事件循环本体不迁。
raw-window-handle = "0.6"
# ai_hook 安装权威(M4.3):codex/kimi 的 TOML 手术保注释保格式;managed 文件
# 归属指纹;cursor/copilot/grok 的 EncodedCommand 形态;codex 能力探针输出
# 暂存与测试 tempdir 隔离;config_guard 的配置目录监听(notify 钉 7 与
# gpui-component 同版本族,防双份构建)。
toml_edit = "0.25"
sha2 = "0.11"
base64 = "0.22"
tempfile = "3"
notify = "7"
# 主题包 ZIP(06 篇 M6.3):Manifest + 整包有界检查 + 导出。
# 版本与 feature 对齐上游主题栈;deflate 走 zlib-rs,不引入 C 依赖。
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 主题包资源签名校验:只开主题包允许的静态图片格式。
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }

[build-dependencies]
# i18n 静态生成器(06 篇):目录遍历由语言注册表驱动,故构建期依赖设置 crate。
slterm-settings = { path = "../slterm_settings" }
# 翻译目录 JSON 解析(嵌套键展平 + 类型拒绝)。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # MonitorFromPoint(开窗前 DPI 预取)。
    "Win32_Graphics_Gdi",
    # 系统 locale 探测(GetUserDefaultLocaleName):界面语言 System 档协商。
    "Win32_Globalization",
    # console 归一化(SetConsoleCtrlHandler)与 panic 报告的 GetConsoleCP。
    "Win32_System_Console",
    # 提权态探针(OpenProcessToken 的 TOKEN_QUERY + TokenElevation)。
    "Win32_Security",
    # 命名管道服务器(ai_hook::windows;PIPE_ACCESS_INBOUND 在 FileSystem,
    # ConnectNamedPipe/ReadFile 的 OVERLAPPED 引用经 Win32_System_IO)。
    "Win32_System_Pipes",
    # pane.exec 一次性子进程整树回收(Job Object,04 篇 M7.3)。
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # 全机进程快照(process_snapshot::windows::NtQuerySystemInformation)。
    "Wdk_System_SystemInformation",
    # 快照原生回归对拍:GetProcessTimes(process_snapshot 测试)。
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    # GetAsyncKeyState(VK_LBUTTON):resize 手势门控(view/layout.rs)。
    "Win32_UI_Input_KeyboardAndMouse",
    # MessageBoxW(启动错误弹面/panic 钩)、SendMessageW(首帧 present-then-show)。
    "Win32_UI_WindowsAndMessaging",
    # SHFileOperationW(回收站删除)与 ShellExecuteW(系统处理器打开)。
    "Win32_UI_Shell",
] }
