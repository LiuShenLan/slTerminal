[package]
name = "tree-sitter-json5"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Joakker/tree-sitter-json5"
description = "json5 grammar for the tree-sitter parsing library"
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.9"

[build-dependencies]
cc = "1.1"
