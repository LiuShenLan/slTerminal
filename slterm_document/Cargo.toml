[package]
name = "slterm_document"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
test = false

[[test]]
name = "lib_tests"
path = "src/lib.rs"

[dependencies]
# 仓库绑定复用规范路径与文件身份，不复制路径事实类型。
slterm_path = { path = "../slterm_path" }
encoding_rs = "=0.8.42"
ropey = { version = "=2.0.0-beta.1", default-features = false, features = ["metric_lines_lf", "metric_utf16"] }
regex = "=1.13.1"
comrak = "=0.57.0"
unicode-normalization = "=0.1.26"
yaml-rust2 = "=0.13.0"
html5ever = "=0.27.0"
# 封闭语言 ID 作为 ViewState 的稳定线缆值；不开放自定义语言字符串。
serde = { version = "1", features = ["derive"] }
uuid = { version = "=1.28.0", default-features = false }
# LanguageRegistry 与 SyntaxWorker 共用同一锁定 Tree-sitter 运行时和 grammar 资产。
tree-sitter = "=0.27.1"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-json = "=0.24.8"
tree-sitter-json5 = "=0.1.0"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-scss = { git = "https://github.com/tree-sitter-grammars/tree-sitter-scss", rev = "9ab738d22bb248771d42e8678d1a307d14990df1", version = "=1.0.0" }
tree-sitter-less = "=1.0.0"
tree-sitter-md = "=0.5.4"
tree-sitter-xml = "=0.7.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-powershell = "=0.26.4"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-sequel = "=0.3.11"
tree-sitter-yaml = "=0.7.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-ini = "=1.4.0"
tree-sitter-diff = "=0.1.0"
tree-sitter-dockerfile = "=0.2.0"
tree-sitter-make = "=1.1.1"

[dev-dependencies]
proptest = "=1.12.0"
