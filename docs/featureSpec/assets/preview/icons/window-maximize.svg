<!-- 项目自绘窗口控制图标，风格对齐 lucide-static：24×24 viewBox、currentColor 描边 -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
 color="#E6E6E6">
  <rect x="3" y="3" width="18" height="18" rx="2" />
</svg>
