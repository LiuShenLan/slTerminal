[package]
name = "slterminal"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false
# F12 环境修复（2026-08-31 实证）：lib 单测经显式 [[test]] 目标承载——
# cargo 的 rustc-link-arg-tests 只对显式 test target 生效，默认 lib test
# 目标收不到 → manifest 无法嵌入 → comctl32 v5 缺 TaskDialogIndirect →
# 0xC0000139 启动崩溃。test=false + [[test]] lib_tests 等效原单测（--test
# lib_tests 定向跑；门禁 cargo test 全量含之）。

[[test]]
name = "lib_tests"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# P0-08: wdio-webdriver 依赖始终编译，但插件初始化在 lib.rs 中用 #[cfg(debug_assertions)] 门控。
# debug_assertions 不是 Cargo 支持的 target cfg predicate，
# 因此无法在 Cargo.toml 层面按 profile 排除依赖。
# 生产构建中插件代码存在但从不初始化——WebDriver 服务器不会被启动。
tauri-plugin-wdio-webdriver = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9.0"
# P1-25: notify 9.0.0 仍为 RC 阶段（最新稳定版 8.2.0, 2025-08-03）。
# rc.4 (2026-05-02) 为当前最新 RC。关注 https://crates.io/crates/notify 正式发布后升级。
notify = "9.0.0-rc.4"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }
tauri-plugin-clipboard-manager = "2"
anyhow = "1"
# SEC-16: sync feature 提供 tokio::sync::Mutex（set_project_root 串行化锁）
# F10: time feature 提供 tokio::time::interval（套餐余量轮询）
tokio = { version = "1", features = ["rt", "sync", "time"] }
base64 = "0.22"
tempfile = "3"
dirs = "6"
git2 = { version = "0.21", features = ["vendored-libgit2"] }
# P1-25: notify-debouncer-full 0.8.0-rc.2 跟随 notify 9.0.0 RC。
# notify 正式发布后同步升级此依赖。
notify-debouncer-full = "0.8.0-rc.2"
dunce = "1"
# SEC-13：脚本状态检测 SHA-256 哈希比对（模板 vs 磁盘脚本防首行伪造；lock 树已有 0.10.x 传递版本）
sha2 = "0.10"
# F10 套餐余量查询（纯阻塞 HTTP，spawn_blocking 调用）
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
nt_version = "0.1"
mopa = "0.2"
filedescriptor = "0.8"
windows = { version = "0.61", features = [
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Pipes",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# TQ-COV-05：SEC-17 审计日志 L1 断言（tracing-test 捕获 warn 日志）。
# no-env-filter：SEC-17 的审计事件带显式 target "audit"（tracing::warn!(target: "audit")），
# 而 tracing-test 默认 env_filter = "<crate>=trace"（按 target 前缀过滤，未命中即丢弃）——
# "audit" 不以 crate 名开头故被过滤，断言恒失败。no-env-filter 使 filter 变 "trace" 全放行
# （官方跨 crate target 捕获开关），audit 事件进入捕获 buffer；本项目仅 2 条 traced_test
# 用例且断言子串独特，无跨依赖日志误命中风险。
# TQ-COV-06：tauri test feature——dev-dependencies 开启 `tauri::test` 模块
# （mock_builder/mock_context），供命令壳测试构造 State<'_, AppState>。
# feature 仅在测试编译时生效（feature unification），release/debug 构建零影响。
[dev-dependencies]
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tauri = { version = "2.11.5", features = ["test"] }
