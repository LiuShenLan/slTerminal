[package]
name = "slterm_runtime_protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 每 crate 显式 test target——定向测试一律
# `cargo test -p slterm_runtime_protocol --test lib_tests <filter>`,禁 filter
# 直打默认 lib target(filter/--lib 会绕过 test=false 重建默认单测 target)。
[lib]
test = false

[[test]]
name = "lib_tests"
path = "src/lib.rs"

# Serde 是生产线缆边界；schemars 仅在 schema feature 与生成器中使用。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "=1.2.3", optional = true }

[features]
schema = ["dep:schemars"]

[[bin]]
name = "runtime-schema"
path = "src/bin/runtime_schema.rs"
required-features = ["schema"]

[dev-dependencies]
jsonschema = { version = "=0.60.1", default-features = false }
tempfile = "3"
