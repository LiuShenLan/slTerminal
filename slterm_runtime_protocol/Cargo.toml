[package]
name = "slterm_runtime_protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 每 crate 显式 test target——定向测试一律
# `cargo test -p slterm_runtime_protocol --test lib_tests <filter>`,禁 filter
# 直打默认 lib target(filter/--lib 会绕过 test=false 重建默认单测 target)。
[lib]
test = false

[[test]]
name = "lib_tests"
path = "src/lib.rs"

# 当前仅保留协议 crate 边界，无生产依赖或测试专用序列化依赖。
[dependencies]
