[package]
name = "slterm_workspace"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
test = false

[[test]]
name = "lib_tests"
path = "src/lib.rs"

[dependencies]
slterm_path = { path = "../slterm_path" }
slterm_document = { path = "../slterm_document" }
slterm_split = { package = "slterm-split", path = "../slterm_split" }
uuid = { version = "=1.28.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
proptest = "=1.12.0"
