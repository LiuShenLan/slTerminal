[package]
name = "slterm_sidebar"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
test = false

[[test]]
name = "lib_tests"
path = "src/lib.rs"

[dependencies]
slterm_workspace = { path = "../slterm_workspace" }
slterm_agents = { path = "../slterm_agents" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
